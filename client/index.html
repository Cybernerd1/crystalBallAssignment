<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Forma is a considered workspace for managing people — browse, search and maintain a user directory backed by MongoDB."
    />
    <title>Forma — People, in focus.</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Inter is a progressive enhancement; the system stack covers offline use. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap"
      rel="stylesheet"
    />
    <script>
      /*
       * First-paint theme restore. Reads the single `app.theme.v1` storage key
       * and sets the CSS variables before React mounts, so a reload never
       * flashes the wrong palette.
       *
       * MAINTENANCE NOTE: this is a *documented mirror* of the preset tokens in
       * src/themes/presets.ts (the PRD's acceptance check allows hex codes only
       * in presets.ts, tokens.css's fallback, and here). If you change a preset,
       * change its mirror too. The font is NOT applied here — it rehydrates into
       * a FontFace a moment after React mounts (the system stack renders until
       * then, by design).
       */
      (function () {
        try {
          var PRESETS = {
            light: {
              'color-bg': '#F7F6F2', 'color-sidebar': '#F2F0EA', 'color-surface': '#FFFFFF',
              'color-surface-alt': '#FAF9F6', 'color-text': '#1B1B19', 'color-text-muted': '#6B6A64',
              'color-border': '#E5E3DC', 'color-accent': '#E64B35', 'color-accent-hover': '#C93C29',
              'color-on-accent': 'rgb(255, 255, 255)', 'color-success': '#3F7A52',
              'color-success-soft': 'rgba(63, 122, 82, 0.12)', 'color-warning': '#916417',
              'color-warning-soft': 'rgba(145, 100, 23, 0.12)', 'color-danger': '#B4432F',
              'color-danger-soft': 'rgba(180, 67, 47, 0.1)', 'color-on-danger': 'rgb(255, 255, 255)',
              'color-overlay': 'rgba(27, 27, 25, 0.4)',
              'shadow-card': '0 1px 2px rgba(27, 27, 25, 0.03)',
              'shadow-overlay': '0 18px 48px rgba(27, 27, 25, 0.16), 0 2px 6px rgba(27, 27, 25, 0.06)',
              'color-scheme': 'light'
            },
            blue: {
              'color-bg': '#F4F5F7', 'color-sidebar': '#EDEFF2', 'color-surface': '#FFFFFF',
              'color-surface-alt': '#F8F9FA', 'color-text': '#191C21', 'color-text-muted': '#646973',
              'color-border': '#E0E3E8', 'color-accent': '#2F62D8', 'color-accent-hover': '#244FB4',
              'color-on-accent': 'rgb(255, 255, 255)', 'color-success': '#347456',
              'color-success-soft': 'rgba(52, 116, 86, 0.12)', 'color-warning': '#8C641C',
              'color-warning-soft': 'rgba(140, 100, 28, 0.12)', 'color-danger': '#B4432F',
              'color-danger-soft': 'rgba(180, 67, 47, 0.1)', 'color-on-danger': 'rgb(255, 255, 255)',
              'color-overlay': 'rgba(25, 28, 33, 0.4)',
              'shadow-card': '0 1px 2px rgba(25, 28, 33, 0.03)',
              'shadow-overlay': '0 18px 48px rgba(25, 28, 33, 0.16), 0 2px 6px rgba(25, 28, 33, 0.06)',
              'color-scheme': 'light'
            },
            violet: {
              'color-bg': '#F6F3F8', 'color-sidebar': '#EFEAF4', 'color-surface': '#FFFFFF',
              'color-surface-alt': '#FAF8FC', 'color-text': '#201A2B', 'color-text-muted': '#676070',
              'color-border': '#E3DEE9', 'color-accent': '#6D4AC8', 'color-accent-hover': '#5838A8',
              'color-on-accent': 'rgb(255, 255, 255)', 'color-success': '#3F7A52',
              'color-success-soft': 'rgba(63, 122, 82, 0.12)', 'color-warning': '#8C641C',
              'color-warning-soft': 'rgba(140, 100, 28, 0.12)', 'color-danger': '#B4432F',
              'color-danger-soft': 'rgba(180, 67, 47, 0.1)', 'color-on-danger': 'rgb(255, 255, 255)',
              'color-overlay': 'rgba(32, 26, 43, 0.4)',
              'shadow-card': '0 1px 2px rgba(32, 26, 43, 0.03)',
              'shadow-overlay': '0 18px 48px rgba(32, 26, 43, 0.16), 0 2px 6px rgba(32, 26, 43, 0.06)',
              'color-scheme': 'light'
            },
            dark: {
              'color-bg': '#171614', 'color-sidebar': '#1C1A17', 'color-surface': '#211F1B',
              'color-surface-alt': '#27241F', 'color-text': '#F2EFE9', 'color-text-muted': '#A49E94',
              'color-border': '#36322B', 'color-accent': '#FF6B52', 'color-accent-hover': '#FF826C',
              'color-on-accent': 'rgb(24, 24, 23)', 'color-success': '#7FBF94',
              'color-success-soft': 'rgba(127, 191, 148, 0.14)', 'color-warning': '#D8A657',
              'color-warning-soft': 'rgba(216, 166, 87, 0.14)', 'color-danger': '#F08A78',
              'color-danger-soft': 'rgba(240, 138, 120, 0.12)', 'color-on-danger': 'rgb(24, 24, 23)',
              'color-overlay': 'rgba(0, 0, 0, 0.58)',
              'shadow-card': '0 1px 2px rgba(0, 0, 0, 0.18)',
              'shadow-overlay': '0 18px 48px rgba(0, 0, 0, 0.46), 0 2px 6px rgba(0, 0, 0, 0.24)',
              'color-scheme': 'dark'
            }
          };
          var LEGACY = { darcula: 'dark', forest: 'light' };
          var DEFAULT = 'light';

          function clamp(n) { return Math.max(0, Math.min(255, Math.round(n))); }
          function hexToRgb(hex) {
            if (hex.length === 4) hex = '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3];
            var n = parseInt(hex.slice(1), 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
          }
          /* WCAG relative luminance + max-contrast pick — same constants as
             resolveTheme.ts (0.179 = white/black crossover point). */
          function contrastText(rgb) {
            var lin = rgb.map(function (c) {
              c /= 255;
              return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
            });
            var lum = 0.2126 * lin[0] + 0.7152 * lin[1] + 0.0722 * lin[2];
            return lum > 0.179 ? 'rgb(24, 24, 23)' : 'rgb(255, 255, 255)';
          }

          var state = null;
          try {
            state = JSON.parse(localStorage.getItem('app.theme.v1') || 'null');
          } catch (e) { /* corrupt state → fall through to defaults */ }

          var storedPreset = state && typeof state.presetId === 'string' ? state.presetId : DEFAULT;
          if (LEGACY[storedPreset]) storedPreset = LEGACY[storedPreset];
          var presetId = PRESETS[storedPreset] ? storedPreset : DEFAULT;
          var tokens = PRESETS[presetId];
          var buttonColor = state && typeof state.buttonColor === 'string'
            && /^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$/.test(state.buttonColor)
            ? state.buttonColor
            : tokens['color-accent'];

          var rgb = hexToRgb(buttonColor);
          var blend = tokens['color-scheme'] === 'dark' ? [255, 255, 255] : [0, 0, 0];
          var hover = 'rgb(' + clamp(rgb[0] + (blend[0] - rgb[0]) * 0.14) + ', '
            + clamp(rgb[1] + (blend[1] - rgb[1]) * 0.14) + ', '
            + clamp(rgb[2] + (blend[2] - rgb[2]) * 0.14) + ')';

          var style = document.documentElement.style;
          for (var name in tokens) style.setProperty('--' + name, tokens[name]);
          style.setProperty('--btn-bg', buttonColor);
          style.setProperty('--btn-bg-hover', hover);
          style.setProperty('--btn-text', contrastText(rgb));
          document.documentElement.setAttribute('data-theme', presetId);
        } catch (e) {
          /* Storage unavailable — stylesheet defaults (Light) apply. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
